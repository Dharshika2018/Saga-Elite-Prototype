<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gifts | Saga Elite Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { saga: { primary: '#f2ca50', surface: '#131313', onSurface: '#e2e2e2' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body data-page="admin-gifts" class="min-h-screen page-enter">
  <div class="grid min-h-screen lg:grid-cols-[260px,1fr]">
    <aside class="admin-sidebar border-r border-zinc-800 bg-[#0e0e0e] p-4">
      <a href="dashboard.html" class="block font-display text-xl text-[#f2ca50]">SAGA ADMIN</a>
      <nav class="mt-6 space-y-1 text-sm">
        <a class="block rounded-md px-3 py-2" href="dashboard.html">Dashboard</a>
        <a class="block rounded-md px-3 py-2" href="drops.html">Drops</a>
        <a class="block rounded-md px-3 py-2" href="products.html">Products</a>
        <a class="block rounded-md px-3 py-2" href="orders.html">Orders</a>
        <a class="block rounded-md px-3 py-2" href="home-images.html">Home Images</a>
        <a class="block rounded-md px-3 py-2" href="notifications.html">Notifications</a>
        <a class="block rounded-md px-3 py-2" href="whatsapp.html">WhatsApp</a>
        <a class="block rounded-md px-3 py-2" href="gifts.html">Gifts</a>
        <a class="block rounded-md px-3 py-2" href="account.html">Account</a>
        <a class="mt-4 block rounded-md px-3 py-2 text-zinc-400" href="../index.html">Back to Storefront</a>
      </nav>
      <div class="mt-5 rounded-md border border-zinc-700 p-3 text-xs">
        Role: <span id="active-role"></span>
        <select id="role-switcher" class="mt-2 w-full rounded-md border border-zinc-700 bg-[#1f1f1f] p-1">
          <option value="guest">Guest</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="superadmin">Superadmin</option>
        </select>
      </div>
    </aside>
    <main class="px-4 py-8 lg:px-8">
      <h1 class="text-3xl font-display">Gift Tier Management</h1>
      <section class="mt-5 surface-card p-4 overflow-auto">
        <table class="w-full min-w-[700px] text-left text-sm">
          <thead><tr class="border-b border-zinc-800"><th class="py-2">Tier</th><th>Gift Item</th><th>Stock</th><th>Action</th></tr></thead>
          <tbody id="gift-table"></tbody>
        </table>
      </section>
      <section class="mt-8 surface-card p-4">
        <h2 class="font-display text-xl">Realtime Test Controls</h2>
        <div id="admin-test-controls" class="mt-3 flex flex-wrap gap-2"></div>
      </section>
    </main>
  </div>
  <div id="toast-stack" class="toast-stack"></div>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
