<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Saga Elite</title>
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="text-2xl font-bold">Notifications</h1>
    </header>
    <main class="p-4">
        <section>
            <h2 class="text-xl font-semibold">Your Notifications</h2>
            <div id="notification-list" class="mt-4">
                <!-- Notifications will be dynamically loaded here -->
            </div>
        </section>
        <section class="mt-6">
            <h2 class="text-lg font-semibold">Filter Notifications</h2>
            <select id="notification-filter" class="mt-2">
                <option value="all">All</option>
                <option value="unread">Unread</option>
                <option value="read">Read</option>
            </select>
        </section>
    </main>
    <footer class="mt-6">
        <p>&copy; 2023 Saga Elite. All rights reserved.</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/mock-data/notifications.js"></script>
</body>
</html>
