<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - Saga Elite</title>
    <link href="../assets/css/styles.css" rel="stylesheet">
    <link href="../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Order Detail</h1>
    </header>
    <main>
        <section id="order-status">
            <h2>Order Status</h2>
            <p id="status">Processing</p>
            <div id="status-timeline">
                <h3>Status Timeline</h3>
                <ul>
                    <li>Order Placed</li>
                    <li>Payment Confirmed</li>
                    <li>Preparing for Shipment</li>
                    <li>Shipped</li>
                    <li>Delivered</li>
                </ul>
            </div>
        </section>
        <section id="items-breakdown">
            <h2>Items Breakdown</h2>
            <ul id="items-list">
                <li>
                    <h3>Product Name</h3>
                    <p>Quantity: 1</p>
                    <p>Price: $XX.XX</p>
                </li>
                <!-- Additional items will be populated here -->
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Saga Elite. All rights reserved.</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
