<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gifts Management</title>
    <link href="../../assets/css/styles.css" rel="stylesheet">
    <link href="../../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto p-4">
        <header class="mb-6">
            <h1 class="text-2xl font-bold">Manage Gifts</h1>
        </header>
        <section>
            <h2 class="text-xl font-semibold mb-4">Gift Tiers</h2>
            <table class="min-w-full bg-white border border-gray-300">
                <thead>
                    <tr>
                        <th class="border-b-2 border-gray-300 px-4 py-2">Tier Name</th>
                        <th class="border-b-2 border-gray-300 px-4 py-2">Minimum Spend</th>
                        <th class="border-b-2 border-gray-300 px-4 py-2">Gift Item</th>
                        <th class="border-b-2 border-gray-300 px-4 py-2">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Example row -->
                    <tr>
                        <td class="border-b border-gray-200 px-4 py-2">Bronze</td>
                        <td class="border-b border-gray-200 px-4 py-2">$50</td>
                        <td class="border-b border-gray-200 px-4 py-2">Gift Card</td>
                        <td class="border-b border-gray-200 px-4 py-2">
                            <button class="text-blue-500">Edit</button>
                            <button class="text-red-500">Delete</button>
                        </td>
                    </tr>
                    <!-- More rows can be added dynamically -->
                </tbody>
            </table>
        </section>
        <section class="mt-6">
            <h2 class="text-xl font-semibold mb-4">Add New Gift Tier</h2>
            <form id="add-gift-form">
                <div class="mb-4">
                    <label for="tier-name" class="block text-sm font-medium">Tier Name</label>
                    <input type="text" id="tier-name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                </div>
                <div class="mb-4">
                    <label for="min-spend" class="block text-sm font-medium">Minimum Spend</label>
                    <input type="number" id="min-spend" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                </div>
                <div class="mb-4">
                    <label for="gift-item" class="block text-sm font-medium">Gift Item</label>
                    <input type="text" id="gift-item" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Add Gift Tier</button>
            </form>
        </section>
    </div>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
