<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Logs - Admin</title>
    <link href="../../assets/css/styles.css" rel="stylesheet">
    <link href="../../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <div class="container mx-auto p-4">
        <header class="mb-4">
            <h1 class="text-2xl font-bold">WhatsApp Logs</h1>
        </header>
        <main>
            <section>
                <h2 class="text-xl font-semibold mb-2">Message Logs</h2>
                <table class="min-w-full bg-white border border-gray-300">
                    <thead>
                        <tr>
                            <th class="py-2 px-4 border-b">Date</th>
                            <th class="py-2 px-4 border-b">User</th>
                            <th class="py-2 px-4 border-b">Message</th>
                            <th class="py-2 px-4 border-b">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Sample log entry -->
                        <tr>
                            <td class="py-2 px-4 border-b">2023-10-01</td>
                            <td class="py-2 px-4 border-b">John Doe</td>
                            <td class="py-2 px-4 border-b">Hello, I would like to know more about my order.</td>
                            <td class="py-2 px-4 border-b">Replied</td>
                        </tr>
                        <!-- Additional log entries will be populated here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
