<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Notifications - Saga Elite</title>
    <link href="../../assets/css/styles.css" rel="stylesheet">
    <link href="../../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="text-2xl font-bold">Admin Notifications</h1>
    </header>
    <main class="p-4">
        <section>
            <h2 class="text-xl font-semibold">Notifications List</h2>
            <div class="notification-filter">
                <label for="filter" class="block mb-2">Filter Notifications:</label>
                <select id="filter" class="border rounded p-2">
                    <option value="all">All</option>
                    <option value="unread">Unread</option>
                    <option value="read">Read</option>
                </select>
            </div>
            <ul class="notification-list mt-4">
                <!-- Notifications will be dynamically populated here -->
            </ul>
        </section>
        <section class="mt-6">
            <h2 class="text-xl font-semibold">Compose Notification</h2>
            <form id="notification-form" class="mt-4">
                <textarea id="notification-message" rows="4" class="border rounded w-full p-2" placeholder="Type your notification message here..."></textarea>
                <button type="submit" class="mt-2 bg-blue-500 text-white rounded p-2">Send Notification</button>
            </form>
        </section>
    </main>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
