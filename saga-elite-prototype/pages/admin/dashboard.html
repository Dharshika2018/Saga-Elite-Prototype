<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Saga Elite</title>
    <link href="../../assets/css/styles.css" rel="stylesheet">
    <link href="../../assets/css/input.css" rel="stylesheet">
</head>
<body>
    <header class="bg-gray-800 text-white p-4">
        <h1 class="text-2xl">Admin Dashboard</h1>
    </header>
    <main class="p-4">
        <section class="mb-6">
            <h2 class="text-xl font-semibold">Key Performance Indicators (KPIs)</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-4 shadow rounded">
                    <h3 class="font-bold">Total Sales</h3>
                    <p>$10,000</p>
                </div>
                <div class="bg-white p-4 shadow rounded">
                    <h3 class="font-bold">Total Orders</h3>
                    <p>150</p>
                </div>
                <div class="bg-white p-4 shadow rounded">
                    <h3 class="font-bold">New Users</h3>
                    <p>30</p>
                </div>
            </div>
        </section>
        <section>
            <h2 class="text-xl font-semibold">Recent Orders</h2>
            <table class="min-w-full bg-white border border-gray-300">
                <thead>
                    <tr>
                        <th class="border-b p-2">Order ID</th>
                        <th class="border-b p-2">Customer</th>
                        <th class="border-b p-2">Total</th>
                        <th class="border-b p-2">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="border-b p-2">#001</td>
                        <td class="border-b p-2">John Doe</td>
                        <td class="border-b p-2">$100</td>
                        <td class="border-b p-2">Shipped</td>
                    </tr>
                    <tr>
                        <td class="border-b p-2">#002</td>
                        <td class="border-b p-2">Jane Smith</td>
                        <td class="border-b p-2">$200</td>
                        <td class="border-b p-2">Processing</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer class="bg-gray-800 text-white p-4 text-center">
        <p>&copy; 2023 Saga Elite. All rights reserved.</p>
    </footer>
    <script src="../../assets/js/app.js"></script>
</body>
</html>
