<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Saga Elite</title>
    <link href="../assets/css/input.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center mb-6">Welcome to Saga Elite</h2>
        
        <div id="auth-panels">
            <div id="login-panel" class="auth-panel mb-4">
                <h3 class="text-xl font-semibold mb-4">Login</h3>
                <form>
                    <div class="mb-4">
                        <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="login-email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="you@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="login-password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md">Login</button>
                </form>
                <p class="mt-4 text-sm text-center">Don't have an account? <a href="#" class="text-blue-500">Register</a></p>
            </div>

            <div id="register-panel" class="auth-panel hidden mb-4">
                <h3 class="text-xl font-semibold mb-4">Register</h3>
                <form>
                    <div class="mb-4">
                        <label for="register-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="register-email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="you@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="register-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="register-password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md">Register</button>
                </form>
                <p class="mt-4 text-sm text-center">Already have an account? <a href="#" class="text-blue-500">Login</a></p>
            </div>

            <div id="otp-panel" class="auth-panel hidden mb-4">
                <h3 class="text-xl font-semibold mb-4">OTP Verification</h3>
                <form>
                    <div class="mb-4">
                        <label for="otp" class="block text-sm font-medium text-gray-700">Enter OTP</label>
                        <input type="text" id="otp" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="123456">
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md">Verify OTP</button>
                </form>
            </div>

            <div id="reset-password-panel" class="auth-panel hidden mb-4">
                <h3 class="text-xl font-semibold mb-4">Reset Password</h3>
                <form>
                    <div class="mb-4">
                        <label for="reset-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="reset-email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="you@example.com">
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
