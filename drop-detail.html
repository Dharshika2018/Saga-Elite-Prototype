<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drop Detail | Saga Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { saga: { primary: '#f2ca50', primaryContainer: '#d4af37', surface: '#131313', surfaceLowest: '#0e0e0e', surfaceContainer: '#1f1f1f', surfaceVariant: '#353535', onSurface: '#e2e2e2' } } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="drop-detail" class="min-h-screen page-enter">
  <header class="sticky top-0 z-40 border-b border-zinc-800 bg-[#0e0e0e]/90 backdrop-blur"><div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-3"><a href="index.html" class="font-display text-xl text-[#f2ca50]">SAGA ELITE</a><nav class="flex flex-wrap items-center gap-3 text-sm"><a class="nav-link" data-nav="home" href="index.html">Home</a><a class="nav-link" data-nav="drops" href="drops.html">Drops</a><a class="nav-link" data-nav="product" href="product-detail.html">Product</a><a class="nav-link" data-nav="cart" href="cart.html">Cart <span data-cart-count>0</span></a><a class="nav-link" data-nav="orders" href="orders.html">Orders</a><a class="nav-link" data-nav="notifications" href="notifications.html">Alerts</a><a class="nav-link" data-role-min="admin" href="admin/dashboard.html">Admin</a></nav><div class="ml-auto flex items-center gap-2 text-xs"><span id="active-role" class="rounded-full border border-[#f2ca50]/30 px-3 py-1"></span><label for="role-switcher" class="text-zinc-400">Role</label><select id="role-switcher" class="rounded-md border border-zinc-700 bg-[#1f1f1f] px-2 py-1"><option value="guest">Guest</option><option value="user">User</option><option value="admin">Admin</option><option value="superadmin">Superadmin</option></select></div></div></header>

  <main class="mx-auto max-w-7xl px-4 py-8">
    <section class="grid gap-6 lg:grid-cols-2">
      <article class="surface-card p-4"><img id="drop-banner" src="" loading="lazy" width="1400" height="900" alt="Drop hero" class="h-72 w-full rounded-lg object-cover" /></article>
      <article class="surface-card p-5"><h1 id="drop-title" class="text-3xl font-display"></h1><p id="drop-description" class="mt-3 text-zinc-300"></p><div class="mt-4 rounded-md bg-[#f2ca50]/10 p-3 text-sm">Countdown: <span id="drop-countdown" class="font-bold text-[#f2ca50]"></span></div></article>
    </section>
    <section class="mt-8"><h2 class="mb-3 text-2xl font-display">Products in This Drop</h2><div id="drop-products" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div></section>
  </main>

  <footer class="mt-8 border-t border-zinc-800 py-6 text-center text-xs text-zinc-500">Rare Fit Forever | <span id="year-now"></span></footer>
  <div id="toast-stack" class="toast-stack"></div>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
